name: SRE Project CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate configuration and source files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate package.json files
        run: |
          set -euo pipefail
          find api-gateway services -name package.json -print0 | while IFS= read -r -d '' file; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')); console.log(process.argv[1] + ' OK')" "$file"
          done

      - name: Validate YAML files
        run: |
          ruby -e 'require "yaml"; Dir["kubernetes/*.yaml", "monitoring/*.yml", "monitoring/grafana/provisioning/**/*.yml", "docker-compose.yml", "docker-stack.yml", "docker-compose.incident.yml"].flatten.each { |f| YAML.load_stream(File.read(f)); puts "#{f} OK" }'

      - name: Validate shell scripts
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
            echo "$script OK"
          done

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: auth-service
            context: services/auth-service
          - image: product-service
            context: services/product-service
          - image: order-service
            context: services/order-service
          - image: payment-service
            context: services/payment-service
          - image: notification-service
            context: services/notification-service
          - image: user-profile-service
            context: services/user-profile-service
          - image: api-gateway
            context: api-gateway
          - image: frontend
            context: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: sre-local/${{ matrix.image }}:ci

  integration-test:
    name: Run local integration test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Docker Compose stack
        run: docker compose up --build -d

      - name: Wait for API Gateway
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api-gateway
          exit 1

      - name: Verify service health and business flow
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/services/health
          curl -fsS http://localhost:3000/api/products
          curl -fsS -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"ci-user","password":"ci-password"}'
          curl -fsS -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"ci-user","password":"ci-password"}'
          curl -fsS -X POST http://localhost:3000/api/orders \
            -H "Content-Type: application/json" \
            -d '{"userId":1,"productId":1,"quantity":1}'
          curl -fsS http://localhost:3000/metrics | grep http_requests_total

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down -v

  publish-images:
    name: Publish Docker images to GHCR
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        run: |
          set -euo pipefail
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(basename '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"

          build_and_push() {
            local name="$1"
            local context="$2"
            docker build \
              -t "ghcr.io/${OWNER_LC}/${REPO_LC}-${name}:latest" \
              -t "ghcr.io/${OWNER_LC}/${REPO_LC}-${name}:${SHORT_SHA}" \
              "$context"
            docker push "ghcr.io/${OWNER_LC}/${REPO_LC}-${name}:latest"
            docker push "ghcr.io/${OWNER_LC}/${REPO_LC}-${name}:${SHORT_SHA}"
          }

          build_and_push auth-service services/auth-service
          build_and_push product-service services/product-service
          build_and_push order-service services/order-service
          build_and_push payment-service services/payment-service
          build_and_push notification-service services/notification-service
          build_and_push user-profile-service services/user-profile-service
          build_and_push api-gateway api-gateway
          build_and_push frontend frontend

  deployment-guide:
    name: Deployment commands summary
    runs-on: ubuntu-latest
    needs: integration-test
    steps:
      - name: Print deployment commands
        run: |
          cat <<'EOF'
          CI completed successfully.

          Manual deployment commands for demo environments:

          Docker Compose:
            ./scripts/start-compose.sh

          Docker Swarm:
            ./scripts/deploy-swarm.sh

          Kubernetes / Minikube:
            minikube start --driver=docker
            eval "$(minikube docker-env)"
            ./scripts/deploy-k8s.sh

          Incident simulation:
            ./scripts/simulate-incident.sh
            ./scripts/recover-incident.sh
          EOF
