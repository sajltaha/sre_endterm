<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Auth</title><link rel="stylesheet" href="/css/styles.css"></head>
<body>
  <nav class="navbar"><a class="brand" href="/">SRE Final Project</a><div class="navlinks"><a href="/pages/services.html">Services</a><a href="/pages/products.html">Products</a><a href="/pages/orders.html">Orders</a><a href="/pages/profiles.html">Profiles</a><a href="/pages/monitoring.html">Monitoring</a></div></nav>
  <main class="container">
    <h1>Authentication Service</h1>
    <p class="lead">This page demonstrates user registration, login, and user listing through the API Gateway.</p>
    <div class="grid">
      <section class="panel">
        <h2>Register User</h2>
        <form id="register-form" class="form-grid">
          <label>Username<input name="username" required placeholder="new-student"></label>
          <label>Password<input name="password" required type="password" placeholder="password"></label>
          <div class="form-row"><button class="button" type="submit">Register</button></div>
        </form>
      </section>
      <section class="panel">
        <h2>Login</h2>
        <form id="login-form" class="form-grid">
          <label>Username<input name="username" required value="student"></label>
          <label>Password<input name="password" required type="password" value="password"></label>
          <div class="form-row"><button class="button" type="submit">Login</button></div>
        </form>
        <div id="login-result"></div>
      </section>
    </div>
    <div id="auth-message" hidden></div>
    <h2>Registered Users</h2>
    <table><thead><tr><th>ID</th><th>Username</th><th>Password</th></tr></thead><tbody id="users-table"></tbody></table>
  </main>
  <script src="/js/api.js"></script><script src="/js/auth.js"></script>
</body>
</html>
