apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: sre-project
spec:
  replicas: 2
  selector:
    matchLabels: { app: product-service }
  template:
    metadata:
      labels: { app: product-service }
    spec:
      containers:
        - name: product-service
          image: sre-product-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3002 }]
          env:
            - { name: PORT, value: "3002" }
            - { name: SERVICE_NAME, value: product-service }
          readinessProbe: { httpGet: { path: /health, port: 3002 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 3002 }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: sre-project
spec:
  selector: { app: product-service }
  ports: [{ port: 3002, targetPort: 3002 }]

