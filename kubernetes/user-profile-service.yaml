apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-profile-service
  namespace: sre-project
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-profile-service }
  template:
    metadata:
      labels: { app: user-profile-service }
    spec:
      containers:
        - name: user-profile-service
          image: sre-user-profile-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3006 }]
          env:
            - { name: PORT, value: "3006" }
            - { name: SERVICE_NAME, value: user-profile-service }
          readinessProbe: { httpGet: { path: /health, port: 3006 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 3006 }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: user-profile-service
  namespace: sre-project
spec:
  selector: { app: user-profile-service }
  ports: [{ port: 3006, targetPort: 3006 }]

