apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sre-project
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: microservices
        metrics_path: /metrics
        static_configs:
          - targets:
              - auth-service:3001
              - product-service:3002
              - order-service:3003
              - payment-service:3004
              - notification-service:3005
              - user-profile-service:3006
              - api-gateway:3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sre-project
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: sre-project
spec:
  type: NodePort
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090

