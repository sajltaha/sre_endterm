apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: sre-project
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      containers:
        - name: order-service
          image: sre-order-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3003 }]
          env:
            - { name: PORT, value: "3003" }
            - { name: SERVICE_NAME, value: order-service }
            - { name: FAIL_ORDER_SERVICE, value: "false" }
            - name: PRODUCT_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: sre-common-config, key: PRODUCT_SERVICE_URL } }
            - name: PAYMENT_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: sre-common-config, key: PAYMENT_SERVICE_URL } }
            - name: DATABASE_URL
              valueFrom: { configMapKeyRef: { name: sre-common-config, key: DATABASE_URL } }
          readinessProbe: { httpGet: { path: /health, port: 3003 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 3003 }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { cpu: "150m", memory: "128Mi" }
            limits: { cpu: "700m", memory: "384Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: sre-project
spec:
  selector: { app: order-service }
  ports: [{ port: 3003, targetPort: 3003 }]

