apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: sre-project
spec:
  replicas: 2
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
    spec:
      containers:
        - name: payment-service
          image: sre-payment-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3004 }]
          env:
            - { name: PORT, value: "3004" }
            - { name: SERVICE_NAME, value: payment-service }
          readinessProbe: { httpGet: { path: /health, port: 3004 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 3004 }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { cpu: "150m", memory: "128Mi" }
            limits: { cpu: "700m", memory: "384Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: sre-project
spec:
  selector: { app: payment-service }
  ports: [{ port: 3004, targetPort: 3004 }]

