version: "3.8"

services:
  auth-service:
    image: sre-auth-service:latest
    environment:
      PORT: 3001
      SERVICE_NAME: auth-service
    ports: ["3001:3001"]
    networks: [sre-net]
    deploy:
      replicas: 2
      restart_policy: { condition: on-failure }
      update_config: { parallelism: 1, delay: 10s }

  product-service:
    image: sre-product-service:latest
    environment:
      PORT: 3002
      SERVICE_NAME: product-service
    ports: ["3002:3002"]
    networks: [sre-net]
    deploy:
      replicas: 2
      restart_policy: { condition: on-failure }
      update_config: { parallelism: 1, delay: 10s }

  order-service:
    image: sre-order-service:latest
    environment:
      PORT: 3003
      SERVICE_NAME: order-service
      PRODUCT_SERVICE_URL: http://product-service:3002
      PAYMENT_SERVICE_URL: http://payment-service:3004
      FAIL_ORDER_SERVICE: "false"
      DATABASE_URL: postgres://sre_user:sre_password@postgres:5432/sre_db
    ports: ["3003:3003"]
    networks: [sre-net]
    deploy:
      replicas: 2
      restart_policy: { condition: on-failure }
      update_config: { parallelism: 1, delay: 10s }

  payment-service:
    image: sre-payment-service:latest
    environment:
      PORT: 3004
      SERVICE_NAME: payment-service
    ports: ["3004:3004"]
    networks: [sre-net]
    deploy:
      replicas: 2
      restart_policy: { condition: on-failure }
      update_config: { parallelism: 1, delay: 10s }

  notification-service:
    image: sre-notification-service:latest
    environment:
      PORT: 3005
      SERVICE_NAME: notification-service
    ports: ["3005:3005"]
    networks: [sre-net]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }

  user-profile-service:
    image: sre-user-profile-service:latest
    environment:
      PORT: 3006
      SERVICE_NAME: user-profile-service
    ports: ["3006:3006"]
    networks: [sre-net]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }

  api-gateway:
    image: sre-api-gateway:latest
    environment:
      PORT: 3000
      SERVICE_NAME: api-gateway
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      USER_PROFILE_SERVICE_URL: http://user-profile-service:3006
    ports: ["3000:3000"]
    networks: [sre-net]
    deploy:
      replicas: 2
      restart_policy: { condition: on-failure }
      update_config: { parallelism: 1, delay: 10s }

  frontend:
    image: sre-frontend:latest
    ports: ["8080:80"]
    networks: [sre-net]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sre_user
      POSTGRES_PASSWORD: sre_password
      POSTGRES_DB: sre_db
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [sre-net]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }

  prometheus:
    image: prom/prometheus:v2.52.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["9090:9090"]
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: alert_rules
        target: /etc/prometheus/alert-rules.yml
    networks: [sre-net]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3007:3000"]
    volumes: [grafana-data:/var/lib/grafana]
    networks: [sre-net]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }

networks:
  sre-net:
    driver: overlay

volumes:
  postgres-data:
  grafana-data:

configs:
  prometheus_config:
    file: ./monitoring/prometheus.yml
  alert_rules:
    file: ./monitoring/alert-rules.yml

